            <line x1="28" y1="148" x2="652" y2="148" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6,6" opacity="0.5"/>

            
                    <g>
                        <text x="160" y="208" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" text-anchor="middle">3.9K</text>
                        <text x="160" y="232" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle" letter-spacing="0.5">⭐ Followers</text>
                    </g>
                
                    <g>
                        <text x="315" y="208" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2328" text-anchor="middle">88</text>
                        <text x="315" y="232" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="12" fill="#57606a" text-anchor="middle" letter-spacing="0.5">📦 Repositories</text>
