                    </g>
                

            

            <g transform="translate(660, 306)">
                <text x="0" y="0" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="10" fill="#57606a" text-anchor="end" opacity="0.6">✨ GitHub Profile Card</text>
            </g>
        </svg>
