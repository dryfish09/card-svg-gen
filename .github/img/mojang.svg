<?xml version="1.0" encoding="UTF-8"?>
        <svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320">
            <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f6f8fa;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#1a7f37;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#1a7f37;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#1a7f37;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#f0883e;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#d29922;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f0883e;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#1a7f37;stop-opacity:0.05" />
                    <stop offset="100%" style="stop-color:#6f42c1;stop-opacity:0.02" />
                </linearGradient>
                <filter id="shadow">
                    <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.1"/>
                </filter>
                <clipPath id="avatarClip">
                    <circle cx="80" cy="80" r="48"/>
                </clipPath>
                <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#1a7f37;stop-opacity:0.2"/>
                    <stop offset="100%" style="stop-color:#1a7f37;stop-opacity:0"/>
                </radialGradient>
                
            </defs>

            <rect x="0" y="0" width="680" height="320" rx="20" ry="20" fill="url(#bgGrad)" filter="url(#shadow)"/>
            
            <rect x="0" y="0" width="680" height="320" rx="20" ry="20" fill="url(#glowGrad)"/>
            
            
            
            <rect x="0" y="0" width="680" height="4" rx="2" ry="2" fill="url(#accentGrad)"/>

            <circle cx="80" cy="80" r="56" fill="url(#avatarGlow)"/>
            
            <circle cx="80" cy="80" r="50" fill="url(#accentGrad)" opacity="0.15"/>
            
            <circle cx="80" cy="80" r="48" fill="#ffffff"/>
            
            <image x="32" y="32" width="96" height="96" clip-path="url(#avatarClip)" href="https://avatars.githubusercontent.com/u/1162641?v=4" preserveAspectRatio="xMidYMid slice"/>

            <g transform="translate(144, 36)">
                <text x="0" y="28" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a7f37" letter-spacing="0.3">Mojang</text>
                
                <text x="0" y="52" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="14" fill="#57606a">@Mojang</text>
                
                
                    <text x="0" y="78" font-family="'SF Pro Display', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1f2328" opacity="0.85">No bio available</text>
                
                
                <g transform="translate(0, 100)">
